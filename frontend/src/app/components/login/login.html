
<!DOCTYPE html>
<div class="login-shell">

  <!-- Fondo animado -->
  <div class="bg-particles">
    <span></span><span></span><span></span>
    <span></span><span></span><span></span>
  </div>

  <div class="login-card">

    <!-- Logo / Branding -->
    <div class="brand">
      <div class="brand-icon">🏔️</div>
      <h1 class="brand-title">Potosí<span>Limpio</span></h1>
      <p class="brand-sub">Sistema de Monitoreo Ambiental</p>
    </div>

    <!-- Mensajes de error -->
    <div class="alert-error" *ngIf="error">
      <span>⚠️</span> {{ error }}
    </div>

    <!-- Formulario -->
    <form class="login-form" (ngSubmit)="onLogin()">
      <div class="field-group">
        <label for="email">Correo electrónico</label>
        <div class="input-wrap">
          <span class="input-icon">✉️</span>
          <input
            id="email"
            type="email"
            [(ngModel)]="credenciales.email"
            name="email"
            placeholder="tu@correo.com"
            autocomplete="email"
          />
        </div>
      </div>

      <div class="field-group">
        <label for="password">Contraseña</label>
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input
            id="password"
            type="password"
            [(ngModel)]="credenciales.password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
          />
        </div>
      </div>

      <button type="submit" class="btn-login" [disabled]="cargando">
        <span *ngIf="!cargando">Ingresar al Sistema</span>
        <span *ngIf="cargando" class="spinner">⟳ Verificando...</span>
      </button>
    </form>

    <div class="login-footer">
      ¿No tienes cuenta?
      <a routerLink="/register">Regístrate aquí</a>
    </div>

  </div>
</div>
